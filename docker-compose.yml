version: '3.8'

services:
  # The Mock Manager (runs on your PC / development environment)
  tessr-mock:
    build: 
      context: .
      target: mock-env
    profiles: ["dev"]
    container_name: flask-storage-manager-mock
    ports:
      - "3177:3177"
    volumes:
      - ./storage_mock:/app/storage_mock
    restart: unless-stopped

  # The Real Manager (runs on the Orange Pi)
  tessr-real:
    build: 
      context: .
      target: real-env
    profiles: ["prod"]
    container_name: flask-storage-manager-real
    ports:
      - "3177:3177"
    volumes:
      - ./storage_real:/app/storage_real
    restart: unless-stopped
    # Privileged is necessary to export and toggle physical GPIO via sysfs (/sys/class/gpio)
    privileged: true
    environment:
      # Optional: Explicitly define which GPIO to use. Pin 17 = 3.3V power normally, 
      # so if you meant a switchable logic pin, define its system GPIO number here.
      - PSU_GPIO_PIN=17

volumes:
  storage_mock:
  storage_real:
